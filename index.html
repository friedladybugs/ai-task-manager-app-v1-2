<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI任务规划</title>
  <style>
    :root{--bg:#f4f6f5;--surface:#fff;--surface-soft:#f8faf9;--surface-tint:#f1f7f4;--text:#17211d;--muted:#66736e;--line:#dfe7e3;--line-soft:#edf2ef;--primary:#1f7a5c;--primary-strong:#176449;--blue:#2f6f8f;--warn:#b66a18;--danger:#c2413a;--shadow:0 6px 18px rgba(24,32,29,.06);--shadow-strong:0 10px 26px rgba(24,32,29,.09)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;letter-spacing:0}button,input,select{font-family:inherit}button{transition:background .15s,border-color .15s,transform .15s}button:active{transform:translateY(1px)}
    .phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:92px}.topbar{padding:18px 18px 11px;position:sticky;top:0;z-index:20;background:rgba(244,246,245,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(223,231,227,.72)}
    .title{font-size:24px;font-weight:800;margin:0;line-height:1.2}.subtitle{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.content{padding:14px 14px 20px}.card,.task-card,.today-item{background:var(--surface);border:1px solid rgba(223,231,227,.9);border-radius:8px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}.task-card,.today-item{box-shadow:none;padding:13px;border-color:var(--line-soft)}
    .hero{border-color:#c8ded6;background:linear-gradient(180deg,#ffffff 0%,#eef8f3 100%);box-shadow:var(--shadow-strong)}.hero h2{margin:0 0 7px;font-size:20px;line-height:1.34;font-weight:800}.muted,.mini,.helper{color:var(--muted)}.mini,.helper{font-size:12px;line-height:1.6}.helper{margin-top:6px}.section-title{font-size:15px;font-weight:800;margin-bottom:11px;line-height:1.35;display:flex;align-items:center;gap:7px}.section-title:before{content:"";width:4px;height:14px;border-radius:4px;background:var(--primary)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.section-head .section-title{margin-bottom:0}
    .progress{width:100%;height:8px;background:#e6eeea;border-radius:8px;overflow:hidden;margin-top:13px}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--blue))}
    .quick-add{width:100%;border:1px solid var(--primary);border-radius:8px;background:var(--primary);color:#fff;padding:14px 14px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 7px 16px rgba(31,122,92,.18)}.quick-add:hover,.primary:hover{background:var(--primary-strong)!important}.secondary-add{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer}.secondary-add:hover,.icon-btn:hover,.inline-actions button:hover,.feedback-row button:hover{background:#edf4f1}
    .task-row,.today-head{display:flex;justify-content:space-between;gap:11px;align-items:flex-start}.task-row>div,.today-head>div{min-width:0}.task-title{font-size:15px;font-weight:800;line-height:1.35;margin-bottom:6px;word-break:break-word}.badge{display:inline-flex;align-items:center;min-height:24px;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;background:#eef4f1;color:#38524a;border:1px solid transparent}.p1{background:#fff0ed;color:#9e322b;border-color:#ffd3cc}.p2{background:#fff7e8;color:#935207;border-color:#ffdda3}.p3{background:#edf8f2;color:#1f6b45;border-color:#c8ead7}.plain{background:#f5f7f6;color:#53625c;border-color:#e4ebe7}.ai-on{background:#e8f7f0;color:#176449;border-color:#c5e8d8}
    .seg,.inline-actions,.feedback-row{display:flex;gap:8px;flex-wrap:wrap}.seg{overflow:auto;flex-wrap:nowrap;margin-bottom:12px;padding-bottom:2px}.seg button,.icon-btn,.inline-actions button,.feedback-row button{border:1px solid var(--line);background:var(--surface-soft);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer}.seg button{background:var(--surface);white-space:nowrap;color:var(--muted);font-weight:700}.seg button.active{background:#eaf7f1;color:var(--primary-strong);border-color:#b9dfcf}.primary{background:var(--primary)!important;border-color:var(--primary)!important;color:#fff!important;font-weight:800}.danger{background:#fff1ef!important;border-color:#ffd5d0!important;color:var(--danger)!important}
    .screen{display:none}.screen.active{display:block}.task-detail{display:none;margin-top:12px;padding:13px;border:1px solid var(--line-soft);background:#fbfcfb;border-radius:8px}.task-detail.open{display:block}.done{text-decoration:line-through;color:var(--muted)}.daily{display:flex;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line)}.daily:last-child{border-bottom:none}input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--primary)}.phase{border:1px solid #d5e5de;border-radius:8px;padding:12px;margin-top:9px;background:#fff;box-shadow:0 4px 12px rgba(24,32,29,.04)}.phase strong{font-size:14px}.phase-head{display:flex;justify-content:space-between;gap:10px;cursor:pointer}.phase-body{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.phase-body.open{display:block}.loading{margin-top:12px;padding:11px;border:1px solid #c8deeb;background:#f0f8fb;border-radius:8px;color:#245f7b;font-size:13px;font-weight:700}
    .deadline-item{border-top:1px dashed var(--line);padding:11px 0}.deadline-item:first-child{border-top:none;padding-top:0}.detail-block{margin-top:13px}.priority-line{font-size:14px;line-height:1.5;padding:11px;border:1px solid #d5e5de;background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(24,32,29,.04)}.priority-line .helper{margin-top:8px;color:#34453f}.plan-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.entry-list{display:grid;gap:9px}.entry-item{border:1px solid var(--line-soft);background:#fbfcfb;border-radius:8px;padding:11px}.entry-text{font-size:14px;line-height:1.45;word-break:break-word}.entry-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:7px}.entry-pool-actions{display:flex;gap:9px;margin-top:12px}.entry-pool-actions button{flex:1;border-radius:8px;padding:10px 12px;border:1px solid var(--primary);font-size:13px;cursor:pointer}.notice{padding:10px 11px;border:1px solid #d5e5de;background:#f6fbf8;border-radius:8px;color:#40564e;font-size:12px;line-height:1.55;margin-bottom:11px}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:40}.nav-btn{border:none;background:transparent;color:var(--muted);font-size:13px;padding:8px 0;cursor:pointer;border-radius:8px}.nav-btn.active{color:var(--primary-strong);font-weight:800;background:#eef7f2}
    .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);width:min(390px,calc(100% - 28px));z-index:80;background:rgba(23,33,29,.94);color:#fff;border-radius:8px;padding:11px 12px;font-size:13px;line-height:1.45;box-shadow:0 10px 26px rgba(24,32,29,.18);display:none}.toast.error{background:rgba(154,51,45,.96)}
    .drawer{position:fixed;inset:0;background:rgba(24,32,29,.34);display:none;align-items:flex-end;z-index:60}.drawer.open{display:flex}.sheet{width:min(430px,100%);margin:0 auto;background:#fff;border-radius:8px 8px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto;box-shadow:0 -12px 28px rgba(24,32,29,.12)}.sheet h3{margin:0 0 14px;font-size:18px}.field{margin-bottom:12px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--muted)}input,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--text)}input:focus,select:focus{outline:none;border-color:#9ed0bc;box-shadow:0 0 0 3px rgba(31,122,92,.12)}details{margin-top:12px;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-soft)}summary{cursor:pointer;font-weight:800;color:#374c44}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet-actions{display:flex;gap:10px;margin-top:14px}.sheet-actions button{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;font-size:14px;font-weight:800}.ghost{background:#f3f6f5;color:var(--text)}.status{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}.setting-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-soft)}.setting-item:last-child{border-bottom:none}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #cfe3dc;border-radius:8px;background:#f2faf6;margin-top:12px}.switch-wrap{position:relative;width:50px;height:28px;flex-shrink:0}.switch-wrap input{opacity:0;width:0;height:0;position:absolute}.slider{position:absolute;inset:0;background:#dbe4e0;border-radius:8px;transition:.2s}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:7px;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:.2s}.switch-wrap input:checked+.slider{background:var(--primary)}.switch-wrap input:checked+.slider:before{transform:translateX(22px)}
  </style>
</head>
<body>
<script src="config.js"></script>
<div class="phone">
  <div class="topbar"><h1 class="title">AI任务规划</h1><p class="subtitle">用户主导，AI 辅助。只在需要拆解和安排节奏时启用 AI。</p></div>
  <div class="content">
    <section id="screen-today" class="screen active"><div class="card hero"><h2 id="heroText">今天先推进最重要的一步。</h2><div class="muted">打开后先看今天该做什么。</div><div class="progress"><div id="todayProgressBar" class="progress-bar"></div></div><div class="helper" id="todayProgressText">今日进度 0%</div></div><div class="card"><button class="quick-add" onclick="openAddSheet()">记录我想做的事</button><div class="helper">任务、习惯、兴趣、偏好、某天有事，都可以先放进事项池。</div></div><div class="card"><div class="section-head"><div class="section-title">事项池</div><button class="secondary-add" onclick="openAddSheet()">记录事项</button></div><div class="notice">第一阶段先保存原始事项；AI 会在你主动整理时再介入。</div><div id="entryPoolToday"></div></div><div class="card"><div class="section-title">今日任务</div><div id="todayList"></div></div><div class="card"><div class="section-title">截止提醒</div><div id="deadlineList"></div></div></section>
    <section id="screen-tasks" class="screen"><div class="card"><div class="section-head"><div class="section-title">事项池</div><button class="secondary-add" onclick="openAddSheet()">记录事项</button></div><div id="entryPool"></div></div><div class="card"><div class="section-head"><div class="section-title">任务</div><button class="secondary-add" onclick="openAddSheet()">添加</button></div><div class="seg"><button class="active" onclick="setFilter('all',this)">全部</button><button onclick="setFilter('planned',this)">已规划</button><button onclick="setFilter('unplanned',this)">未规划</button><button onclick="setFilter('done',this)">已完成</button></div><div id="taskList"></div></div></section>
    <section id="screen-settings" class="screen"><div class="card"><div class="section-title">设置</div><div class="setting-item"><div><div>鼓励风格</div><div class="helper">影响首页提示、完成反馈和未完成反馈。</div></div><select id="toneSelect" onchange="changeTone()"><option value="gentle">温柔陪伴型</option><option value="firm">坚定推动型</option><option value="minimal">克制简洁型</option></select></div><div class="setting-item"><div><div>提醒设置</div><div class="helper">到点弹提醒。</div></div><button class="icon-btn" onclick="requestBrowserPermission()">开启</button></div><div class="setting-item"><div><div>帮助说明</div><div class="helper">查看产品逻辑。</div></div><button class="icon-btn" onclick="openHelp()">查看</button></div><div class="setting-item"><div><div>数据清空</div><div class="helper">删除当前本地所有任务数据。</div></div><button class="icon-btn danger" onclick="clearAllTasks()">清空</button></div><div id="status" class="status"></div></div></section>
  </div>
  <nav class="bottom-nav"><button class="nav-btn active" onclick="switchTab('today',this)">今日</button><button class="nav-btn" onclick="switchTab('tasks',this)">任务</button><button class="nav-btn" onclick="switchTab('settings',this)">设置</button></nav>
</div>

<div id="addDrawer" class="drawer" onclick="closeDrawerByMask(event)"><div class="sheet">
  <h3>记录事项</h3>
  <div class="field"><label>我想记录</label><input id="taskInput" placeholder="例如：月底交报告 / 每天散步 / 周五全天有事 / 想多看书"></div>
  <div class="field"><label>相关日期 / 截止日期（可选）</label><input id="deadlineInput" type="date"></div>
  <div class="switch-row"><div><strong>AI 默认不自动处理</strong><div class="helper">先进入事项池，需要时再点击“AI整理日程”。</div></div><label class="switch-wrap"><input id="autoPlanSwitch" type="checkbox" disabled><span class="slider"></span></label></div>
  <details><summary>更多设置</summary><div class="two-col" style="margin-top:12px"><div class="field"><label>开始日期</label><input id="startDateInput" type="date"></div><div class="field"><label>提醒时间</label><input id="reminderTimeInput" type="time"></div></div><div class="field"><label>优先级模式</label><select id="priorityModeInput"><option value="ai" selected>AI 自动判断</option><option value="manual_p1">手动：应立即推进</option><option value="manual_p2">手动：应稳定推进</option><option value="manual_p3">手动：可择时处理</option></select></div><div class="two-col"><div class="field"><label>难度</label><select id="difficultyInput"><option value="">AI 自动判断</option><option value="简单">简单</option><option value="中等">中等</option><option value="困难">困难</option></select></div><div class="field"><label>预计总耗时</label><input id="effortInput" placeholder="AI 自动估计，可手填"></div></div></details>
  <div class="sheet-actions"><button class="ghost" onclick="closeAddSheet()">取消</button><button class="primary" onclick="addTask()">保存到事项池</button></div>
</div></div>

<script>
const STORAGE_KEY="ai_task_manager_app_v12";
const V2_BACKUP_KEY="ai_task_manager_app_v12_backup_before_v2";
const AI_CONFIG=initAIConfig();
let state=loadState(),currentFilter="all";
function uid(p="id"){return p+"_"+Math.random().toString(36).slice(2,9)+"_"+Date.now().toString(36)}
function formatDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function todayStr(){return formatDate(new Date())}
function plusDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return formatDate(d)}
function diffDays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)}
function normalizeDate(v,fallback=""){const m=String(v||"").match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:fallback}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function safeGet(k){try{return localStorage.getItem(k)||""}catch{return""}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function cleanBaseUrl(v){return String(v||"").trim().replace(/\/+$/,"")}
function initAIConfig(){const q=new URLSearchParams(location.search),queryBase=q.get("ai_api")||q.get("api_base")||"",base=cleanBaseUrl(queryBase||window.AI_TASK_API_BASE_URL||safeGet("AI_TASK_API_BASE_URL"));if(queryBase&&base)safeSet("AI_TASK_API_BASE_URL",base);const paths={quick:"/api/plan-task-quick",detail:"/api/plan-task-detail",...(window.AI_TASK_API_PATHS||{})},quickTimeout=Number(window.AI_TASK_QUICK_TIMEOUT_MS||safeGet("AI_TASK_QUICK_TIMEOUT_MS")||45000),detailTimeout=Number(window.AI_TASK_DETAIL_TIMEOUT_MS||safeGet("AI_TASK_DETAIL_TIMEOUT_MS")||90000);return{baseURL:base,paths,timeouts:{quick:Number.isFinite(quickTimeout)&&quickTimeout>0?quickTimeout:45000,detail:Number.isFinite(detailTimeout)&&detailTimeout>0?detailTimeout:90000}}}
function createBaseState(){return{schemaVersion:2,tasks:[],settings:{tone:"gentle",browserNotifyEnabled:false,asked:{}},entries:[],items:[],schedules:{},dayStates:{},preferences:{importantTime:"anytime",maxDailyFocus:3,keepLeisureTime:true,includeExercise:false,lightWeekend:true,encouragementStyle:"gentle",planningMode:"balanced"},planningRuns:[],rescheduleLogs:[],migratedAt:""}}
function backupBeforeV2Migration(raw){if(!raw||safeGet(V2_BACKUP_KEY))return;safeSet(V2_BACKUP_KEY,raw)}
function loadState(){const base=createBaseState();try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return base;const p=JSON.parse(raw);if(p.schemaVersion!==2)backupBeforeV2Migration(raw);return normalizeState(p,base)}catch{return base}}
function normalizeState(p,base=createBaseState()){const tasks=Array.isArray(p.tasks)?p.tasks.map(normalizeTask):[];const settings={...base.settings,...(p.settings||{})};settings.asked=settings.asked||{};const entries=Array.isArray(p.entries)?p.entries.map(normalizeEntry):migrateTasksToEntries(tasks);const items=Array.isArray(p.items)?p.items.map(normalizeItem):migrateTasksToItems(tasks,entries);const preferences={...base.preferences,...(p.preferences||{})};preferences.encouragementStyle=preferences.encouragementStyle||settings.tone||"gentle";return{...base,...p,schemaVersion:2,tasks,settings,entries,items,schedules:p.schedules&&typeof p.schedules==="object"?p.schedules:{},dayStates:p.dayStates&&typeof p.dayStates==="object"?p.dayStates:{},preferences,planningRuns:Array.isArray(p.planningRuns)?p.planningRuns:[],rescheduleLogs:Array.isArray(p.rescheduleLogs)?p.rescheduleLogs:[],migratedAt:p.migratedAt||new Date().toISOString()}}
function normalizeEntry(e){return{id:e.id||uid("entry"),text:e.text||e.rawText||e.title||"",status:e.status||"pending",createdAt:e.createdAt||new Date().toISOString(),updatedAt:e.updatedAt||e.createdAt||new Date().toISOString(),source:e.source||"manual",taskId:e.taskId||""}}
function normalizeItem(i){return{id:i.id||uid("item"),entryId:i.entryId||"",taskId:i.taskId||"",rawText:i.rawText||i.title||"",title:i.title||i.rawText||"",category:i.category||"unclassified",status:i.status||"active",priority:i.priority||"medium",deadline:i.deadline||null,fixedDate:i.fixedDate||null,preferredTime:i.preferredTime||"anytime",createdAt:i.createdAt||new Date().toISOString(),updatedAt:i.updatedAt||i.createdAt||new Date().toISOString(),aiReason:i.aiReason||""}}
function migrateTasksToEntries(tasks){return tasks.map(t=>normalizeEntry({id:`entry_${t.id}`,text:t.title,status:"processed",createdAt:t.createdAt,updatedAt:t.createdAt,source:"legacy_task",taskId:t.id}))}
function migrateTasksToItems(tasks,entries){return tasks.map(t=>{const entry=entries.find(e=>e.taskId===t.id)||{};return normalizeItem({id:`item_${t.id}`,entryId:entry.id||`entry_${t.id}`,taskId:t.id,rawText:t.title,title:t.title,category:"legacy_task",status:t.done?"done":"active",priority:t.ai?.priority==="p1"?"high":t.ai?.priority==="p3"?"low":"medium",deadline:t.deadline||null,createdAt:t.createdAt,updatedAt:t.createdAt,aiReason:"由 v1.2 任务数据兼容迁移"})})}
function normalizeTask(t){return{id:t.id||uid("task"),title:t.title||t.task||"",startDate:t.startDate||t.start_date||todayStr(),deadline:t.deadline||t.endDate||t.end_date||todayStr(),reminderTime:t.reminderTime||"",priorityMode:t.priorityMode||"ai",userDifficulty:t.userDifficulty||t.difficulty||"",userEffortEstimate:t.userEffortEstimate||t.effortEstimate||"",autoPlan:typeof t.autoPlan==="boolean"?t.autoPlan:!!t.ai,ai:normalizeAI(t.ai),done:!!t.done,detailOpen:!!t.detailOpen,dailyFeedbackHistory:Array.isArray(t.dailyFeedbackHistory)?t.dailyFeedbackHistory:[],pendingReasonCheck:!!t.pendingReasonCheck,planningStatus:"",createdAt:t.createdAt||new Date().toISOString()}}
function normalizeAI(ai){if(!ai)return null;ai.phases=Array.isArray(ai.phases)?ai.phases.map((p,i)=>({id:p.id||uid("phase"),phase_name:p.phase_name||`阶段 ${i+1}`,from_date:p.from_date||"",to_date:p.to_date||"",duration_days:Number(p.duration_days||1),goal:p.goal||"",open:!!p.open||i===0,rest_after_phase:p.rest_after_phase||{needed:false,days:0,suggestion:""},daily_plan:Array.isArray(p.daily_plan)?p.daily_plan.map((d,j)=>({id:d.id||uid("day"),day_label:d.day_label||`第 ${j+1} 天`,date:d.date||"",time_range:d.time_range||"",task:d.task||"",done:!!d.done})):[]})):[];return ai}
function saveState(){state=normalizeState(state);localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
let toastTimer=null;
function setStatus(m,e=false){const el=document.getElementById("status");if(el){el.textContent=m||"";el.style.color=e?"#dc2626":"#6b7280"}if(!m)return;let toast=document.getElementById("appToast");if(!toast){toast=document.createElement("div");toast.id="appToast";toast.className="toast";document.body.appendChild(toast)}toast.textContent=m;toast.className=e?"toast error":"toast";toast.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.style.display="none"},3600)}
function priText(p){return p==="p1"?"应立即推进":p==="p2"?"应稳定推进":"可择时处理"}function priClass(p){return p==="p1"?"p1":p==="p2"?"p2":"p3"}
function toneText(type,name=""){const t=state.settings.tone||"gentle",m={gentle:{hero:"慢一点也没关系，今天只需要把最重要的一步迈出去。",done:`做得很好，${name?`“${name}”`:"这一步"}已经被你推进了。`,miss:"我想了解一下昨天没完成的原因，这样后面的安排会更贴合你。"},firm:{hero:"先开始，不求一口吃完，只求今天推进一点。",done:`不错，${name?`“${name}”`:"当前任务"}已经向前推进。`,miss:"说出昨天没完成的主要原因，我会据此重新调整。"},minimal:{hero:"今天先完成最关键的一步。",done:`已记录完成：${name||"当前任务"}。`,miss:"请选择昨天未完成的原因。"}};return m[t][type]||""}

function addEntryAndItem({text,task,deadline}){const now=new Date().toISOString(),entry={id:uid("entry"),text,status:"pending",createdAt:now,updatedAt:now,source:"manual",taskId:task.id};const item={id:uid("item"),entryId:entry.id,taskId:task.id,rawText:text,title:text,category:"unclassified",status:"active",priority:"medium",deadline:deadline||null,fixedDate:null,preferredTime:"anytime",createdAt:now,updatedAt:now,aiReason:"第一阶段先进入事项池，等待后续 AI 整理"};state.entries.unshift(entry);state.items.unshift(item)}
async function addTask(){const title=taskInput.value.trim(),startDate=startDateInput.value||todayStr(),rawDeadline=deadlineInput.value,deadline=rawDeadline||startDate;if(!title)return setStatus("请输入要记录的事项。",true);if(diffDays(startDate,deadline)<0)return setStatus("相关日期不能早于开始日期。",true);const task={id:uid("task"),title,startDate,deadline,reminderTime:reminderTimeInput.value||"",priorityMode:priorityModeInput.value,userDifficulty:difficultyInput.value||"",userEffortEstimate:effortInput.value.trim(),autoPlan:false,ai:null,done:false,detailOpen:false,dailyFeedbackHistory:[],pendingReasonCheck:false,planningStatus:"",createdAt:new Date().toISOString()};state.tasks.unshift(task);addEntryAndItem({text:title,task,deadline:rawDeadline||null});saveState();render();closeAddSheet();resetForm();setStatus("已保存到事项池。需要 AI 时，请主动点击“AI整理日程”或在任务详情里生成 AI 计划。")}
function resetForm(){taskInput.value="";deadlineInput.value="";reminderTimeInput.value="";effortInput.value="";difficultyInput.value="";priorityModeInput.value="ai";autoPlanSwitch.checked=false;startDateInput.value=todayStr()}
function aiUnavailableMessage(){return"当前未连接 AI 服务，先以本地模式使用。"}
function hasAIService(){return !!AI_CONFIG.baseURL}
function planPayload(task,adjustmentContext=null,quickPlan=null){return{task:task.title,startDate:task.startDate,endDate:task.deadline,reminderTime:task.reminderTime,priorityMode:task.priorityMode,difficulty:task.userDifficulty,effortEstimate:task.userEffortEstimate,tone:state.settings.tone,adjustmentContext,quickPlan}}
function setPlanningStatus(id,msg){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.planningStatus=msg;saveState();render();setStatus(msg)}
function stageTimer(id){return setTimeout(()=>{const t=state.tasks.find(x=>x.id===id);if(t?.planningStatus==="正在判断任务类型...")setPlanningStatus(id,"正在生成今日建议...")},700)}
function aiEndpoint(name){return `${AI_CONFIG.baseURL}${AI_CONFIG.paths[name]||name}`}
function normalizeAIError(e,stage="ai"){if(e?.name==="AbortError")return stage==="detail"?"完整计划生成较慢，已保留基础建议。你可以稍后重新生成。":"服务正在启动或响应较慢，请稍等后再试。";if(e instanceof TypeError)return aiUnavailableMessage();return e?.message||aiUnavailableMessage()}
async function requestAI(name,payload){if(!hasAIService())throw new Error(aiUnavailableMessage());const controller=new AbortController(),timeout=AI_CONFIG.timeouts?.[name]||60000,timer=setTimeout(()=>controller.abort(),timeout);try{const res=await fetch(aiEndpoint(name),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:controller.signal});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.detail||data.error||aiUnavailableMessage());return data}catch(e){throw new Error(normalizeAIError(e,name))}finally{clearTimeout(timer)}}
async function analyzeTask(id,adjustmentContext=null){const task=state.tasks.find(t=>t.id===id);if(!task)return;if(!hasAIService()){task.detailOpen=true;task.planningStatus="";saveState();render();setStatus(aiUnavailableMessage(),true);return null}const previous={autoPlan:task.autoPlan,ai:task.ai,done:task.done};task.autoPlan=true;task.detailOpen=true;task.ai=null;task.planningStatus="正在判断任务类型...";saveState();render();setStatus(task.planningStatus);const timer=stageTimer(id);try{const quick=await requestAI("quick",planPayload(task,adjustmentContext));clearTimeout(timer);task.ai=normalizeResult(quick,task);task.done=calcDone(task);task.detailOpen=true;if(task.ai.complexity!=="complex"){task.planningStatus="";saveState();render();setStatus("AI 判断为简单任务，已生成轻量建议。");return task}task.planningStatus="正在补全完整计划...";saveState();render();setStatus("已生成基础建议，完整计划仍在补全中...");try{const detail=await requestAI("detail",planPayload(task,adjustmentContext,quick));task.ai=normalizeResult({...quick,...detail,complexity:"complex"},task);task.done=calcDone(task);task.detailOpen=true;task.planningStatus="";saveState();render();setStatus("AI 规划完成。");return task}catch(detailError){task.planningStatus="";task.ai=normalizeResult(quick,task);task.done=calcDone(task);task.detailOpen=true;saveState();render();setStatus(detailError.message||"完整计划生成较慢，已保留基础建议。你可以稍后重新生成。",true);return task}}catch(e){clearTimeout(timer);task.autoPlan=previous.autoPlan;task.ai=previous.ai;task.done=previous.done;task.detailOpen=true;task.planningStatus="";saveState();render();setStatus(normalizeAIError(e,"quick"),true);return null}}
function ensureTodayPlan(r,task){if(r.complexity!=="complex"||!r.phases.length)return r;const today=todayStr();if(diffDays(task.startDate,today)<0||diffDays(today,task.deadline)<0)return r;const hasToday=r.phases.some(p=>(p.daily_plan||[]).some(d=>d.date===today));if(hasToday)return r;const firstPhase=r.phases[0];const firstPlan=(firstPhase.daily_plan||[])[0];firstPhase.daily_plan=firstPhase.daily_plan||[];firstPhase.daily_plan.unshift({id:uid("day"),day_label:"今天",date:today,time_range:firstPlan?.time_range||task.reminderTime||"",task:r.today_focus||firstPlan?.task||firstPhase.goal||task.title,done:false});return r}
function normalizeResult(d,task){const r={complexity:d.complexity==="complex"?"complex":"simple",complexity_reason:d.complexity_reason||"",priority:["p1","p2","p3"].includes(d.priority)?d.priority:"p2",priority_reason:d.priority_reason||"",difficulty:d.difficulty||task.userDifficulty||"中等",effort_estimate:d.effort_estimate||task.userEffortEstimate||"",summary:d.summary||"",encouragement:d.encouragement||"",today_focus:d.today_focus||"",phases:[]};if(r.complexity==="complex"&&Array.isArray(d.phases))r.phases=d.phases.slice(0,3).map((p,i)=>({id:uid("phase"),phase_name:p.phase_name||`阶段 ${i+1}`,from_date:normalizeDate(p.from_date,task.startDate),to_date:normalizeDate(p.to_date,task.deadline),duration_days:Number(p.duration_days||1),goal:p.goal||"",open:i===0,rest_after_phase:{needed:!!p?.rest_after_phase?.needed,days:Number(p?.rest_after_phase?.days||0),suggestion:p?.rest_after_phase?.suggestion||""},daily_plan:Array.isArray(p.daily_plan)?p.daily_plan.slice(0,3).map((x,j)=>({id:uid("day"),day_label:x.day_label||`第 ${j+1} 天`,date:normalizeDate(x.date,plusDays(task.startDate,i+j)),time_range:x.time_range||"",task:x.task||"",done:false})):[]}));return ensureTodayPlan(r,task)}
function calcDone(t){if(!t.ai||t.ai.complexity!=="complex")return!!t.done;const all=t.ai.phases.flatMap(p=>p.daily_plan||[]);return all.length&&all.every(x=>x.done)}
function progress(t){if(!t.ai||t.ai.complexity!=="complex")return t.done?100:0;const all=t.ai.phases.flatMap(p=>p.daily_plan||[]);return all.length?Math.round(all.filter(x=>x.done).length/all.length*100):0}

async function submitPaceFeedback(id,type){const t=state.tasks.find(x=>x.id===id);if(!t)return;const map={too_much:"今天太多了",just_right:"今天正好",too_little:"今天太少了",can_add_more:"我还可以再加一点"};t.dailyFeedbackHistory.push({at:new Date().toISOString(),type,label:map[type]});saveState();await analyzeTask(id,{mode:"pace_feedback",feedback_type:type,message:map[type]})}

async function enableAIPlan(id){currentFilter="all";document.querySelectorAll(".seg button").forEach((b,i)=>b.classList.toggle("active",i===0));await analyzeTask(id)}function regeneratePlan(id){analyzeTask(id)}

function deadlineText(t){const remain=diffDays(todayStr(),t.deadline);return remain<0?"已过期":remain===0?"今天截止":`${remain} 天后截止`}
function renderDeadlineReminders(){const items=state.tasks.filter(t=>!t.done).sort((a,b)=>diffDays(todayStr(),a.deadline)-diffDays(todayStr(),b.deadline)).slice(0,2);deadlineList.innerHTML=items.length?items.map(t=>{const p=t.ai?.priority||"p2";return `<div class="deadline-item"><div class="today-head"><div><strong>${esc(t.title)}</strong><div class="mini">${esc(t.deadline)} ｜ ${deadlineText(t)}</div></div><span class="badge ${priClass(p)}">${priText(p)}</span></div></div>`}).join(""):`<div class="mini">暂时没有需要提醒的截止任务。</div>`}

function renderEntryPool(targetId="entryPool",limit=8){const el=document.getElementById(targetId);if(!el)return;const entries=state.entries||[],pending=entries.filter(e=>e.status==="pending").length,recent=entries.slice(0,limit);const list=recent.length?`<div class="entry-list">${recent.map(e=>`<div class="entry-item"><div class="entry-text">${esc(e.text)}</div><div class="entry-meta"><span class="badge ${e.status==="pending"?"plain":"ai-on"}">${entryStatusText(e.status)}</span><span class="mini">${esc((e.createdAt||"").slice(0,10))}</span></div></div>`).join("")}</div>`:`<div class="task-card">事项池还是空的。可以先把脑子里的事随手记下来。</div>`;el.innerHTML=`${list}<div class="entry-pool-actions"><button class="primary" onclick="organizeScheduleV2()">AI整理日程</button></div><div class="helper">当前共有 ${entries.length} 条事项，${pending} 条待整理。第一阶段先预留批量整理入口，不会自动消耗 AI token。</div>`}

function renderToday(){heroText.textContent=toneText("hero");const today=todayStr(),items=[];state.tasks.forEach(t=>{if(t.done||!t.autoPlan||t.ai?.complexity!=="complex")return;(t.ai.phases||[]).forEach(p=>(p.daily_plan||[]).forEach(d=>{if(normalizeDate(d.date)===today)items.push({taskId:t.id,phaseId:p.id,dayId:d.id,title:t.title,priority:t.ai.priority||"p2",text:d.task,done:d.done})}))});items.sort((a,b)=>a.priority>b.priority?1:-1);const done=items.filter(x=>x.done).length,percent=items.length?Math.round(done/items.length*100):0;todayProgressBar.style.width=percent+"%";todayProgressText.textContent=`今日进度 ${percent}%`;todayList.innerHTML=items.length?items.map(i=>`<div class="today-item"><div class="today-head"><div><strong>${esc(i.text)}</strong><div class="mini">${esc(i.title)}</div></div><span class="badge ${priClass(i.priority)}">${priText(i.priority)}</span></div><div class="daily"><input type="checkbox" ${i.done?"checked":""} onchange="toggleDailyPlan('${i.taskId}','${i.phaseId}','${i.dayId}')"><div class="${i.done?"done":""}">完成后勾选</div></div></div>`).join(""):`<div class="today-item">今天还没有已启用 AI 规划的复杂任务安排。</div>`;renderDeadlineReminders()}

function renderPlannedDetail(t){const ai=t.ai,p=ai?.priority||"p2",pct=progress(t);if(!ai)return `<div class="mini">正在等待 AI 返回轻量判断。</div>`;const actions=`<div class="inline-actions detail-block"><button onclick="setManualPriority('${t.id}','p1')">改为立即推进</button><button onclick="setManualPriority('${t.id}','p2')">改为稳定推进</button><button onclick="setManualPriority('${t.id}','p3')">改为择时处理</button><button class="primary" onclick="regeneratePlan('${t.id}')">重新生成 AI 计划</button>${ai.complexity!=="complex"?`<button onclick="markSimpleTaskDone('${t.id}')">${t.done?"取消完成":"标记完成"}</button>`:""}<button class="danger" onclick="deleteTask('${t.id}')">删除</button></div>`;return `<div class="priority-line"><span class="badge ${priClass(p)}">${priText(p)}</span><div class="helper">${esc(ai.priority_reason||"等待判断")}</div></div><div class="detail-block mini">${esc(ai.summary||"AI 已生成轻量建议。")}</div>${ai.complexity==="complex"?renderComplex(t,pct):renderSimple(t,pct)}${actions}`}

function renderComplex(t,pct){const phases=(t.ai?.phases||[]).map(p=>`<div class="phase"><strong>${esc(p.phase_name)}</strong><div class="mini">${esc(p.from_date)} 至 ${esc(p.to_date)} ｜ ${esc(p.duration_days)} 天</div><div class="mini">目标：${esc(p.goal)}</div><div class="helper">${p.rest_after_phase?.needed?`阶段后建议休息 ${esc(p.rest_after_phase.days||0)} 天：${esc(p.rest_after_phase.suggestion||"")}`:esc(p.rest_after_phase?.suggestion||"当前时间较紧，建议直接进入下一阶段。")}</div></div>`).join("");const days=(t.ai?.phases||[]).map(p=>(p.daily_plan||[]).map(d=>`<div class="daily"><input type="checkbox" ${d.done?"checked":""} onchange="toggleDailyPlan('${t.id}','${p.id}','${d.id}')"><div><strong class="${d.done?"done":""}">${esc(d.day_label)} ｜ ${esc(d.date)}</strong><div class="mini ${d.done?"done":""}">${esc(d.task)}${d.time_range?" ｜ "+esc(d.time_range):""}</div></div></div>`).join("")).join("");return `<div class="detail-block"><div class="section-title">阶段计划</div>${phases||`<div class="mini">暂无阶段计划，正在补全时会显示在这里。</div>`}</div><div class="detail-block"><div class="section-title">每日安排</div>${days||`<div class="mini">暂无每日安排。</div>`}</div><div class="detail-block"><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div class="helper">当前进度 ${pct}%</div></div><div class="detail-block"><div class="section-title">节奏反馈</div><div class="feedback-row"><button onclick="submitPaceFeedback('${t.id}','too_much')">今天太多了</button><button onclick="submitPaceFeedback('${t.id}','just_right')">今天正好</button><button onclick="submitPaceFeedback('${t.id}','too_little')">今天太少了</button><button onclick="submitPaceFeedback('${t.id}','can_add_more')">我还可以再加一点</button></div></div>${t.pendingReasonCheck?`<div class="detail-block"><div class="mini">${esc(toneText("miss"))}</div><div class="feedback-row"><button onclick="submitMissReason('${t.id}','时间不够')">时间不够</button><button onclick="submitMissReason('${t.id}','任务太难')">任务太难</button><button onclick="submitMissReason('${t.id}','今天状态不好')">状态不好</button><button onclick="submitMissReason('${t.id}','临时有别的事')">临时有事</button><button onclick="submitMissReason('${t.id}','计划太满')">计划太满</button><button onclick="submitMissReason('${t.id}','其他')">其他</button></div></div>`:""}`}
function maybeAskMissedReason(){const today=todayStr();state.tasks.forEach(t=>{if(!t.autoPlan||t.ai?.complexity!=="complex")return;const y=plusDays(today,-1),items=t.ai.phases.flatMap(p=>p.daily_plan||[]).filter(d=>d.date===y),key=`${t.id}_${y}_miss_reason`;if(items.length&&items.some(i=>!i.done)&&!state.settings.asked[key]){state.settings.asked[key]=true;t.pendingReasonCheck=true}});saveState()}
function checkReminders(){const now=new Date(),date=todayStr(),time=now.toTimeString().slice(0,5);state.tasks.forEach(t=>{if(t.done||!t.reminderTime||t.deadline<date)return;const key=`${t.id}_${date}_${t.reminderTime}`;if(time>=t.reminderTime&&!state.settings.asked[key]){state.settings.asked[key]=true;saveState();setStatus(`提醒：${t.title}`);if("Notification"in window&&state.settings.browserNotifyEnabled&&Notification.permission==="granted")new Notification("任务提醒",{body:`${t.title}：该开始处理了。`})}})}
function render(){renderToday();renderAllEntryPools();renderTaskList();toneSelect.value=state.settings.tone||"gentle"}
window.addEventListener("load",()=>{startDateInput.value=todayStr();maybeAskMissedReason();saveState();render();checkReminders();setInterval(checkReminders,60000)})
</script>
</body>
</html>
