<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI 私人日程秘书</title>
  <style>
    :root{--bg:#f4f6f5;--surface:#fff;--soft:#f8faf9;--tint:#eef8f3;--text:#17211d;--muted:#66736e;--line:#dfe7e3;--line2:#edf2ef;--primary:#1f7a5c;--primary2:#176449;--blue:#2f6f8f;--warn:#b66a18;--danger:#c2413a;--shadow:0 6px 18px rgba(24,32,29,.06);--shadow2:0 10px 26px rgba(24,32,29,.09)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;letter-spacing:0}button,input,select,textarea{font-family:inherit}button{transition:background .15s,border-color .15s,transform .15s}button:active{transform:translateY(1px)}
    .phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:92px}.topbar{padding:18px 18px 11px;position:sticky;top:0;z-index:20;background:rgba(244,246,245,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(223,231,227,.72)}.title{font-size:24px;font-weight:800;margin:0;line-height:1.2}.subtitle{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.content{padding:14px 14px 20px}
    .screen{display:none}.screen.active{display:block}.card,.task-card,.today-item,.day-card{background:var(--surface);border:1px solid rgba(223,231,227,.9);border-radius:8px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}.task-card,.today-item,.day-card{box-shadow:none;padding:13px;border-color:var(--line2)}.hero{border-color:#c8ded6;background:linear-gradient(180deg,#fff 0%,#eef8f3 100%);box-shadow:var(--shadow2)}.hero h2{margin:0 0 7px;font-size:20px;line-height:1.34;font-weight:800}.muted,.mini,.helper{color:var(--muted)}.mini,.helper{font-size:12px;line-height:1.6}.helper{margin-top:6px}
    .section-title{font-size:15px;font-weight:800;margin-bottom:11px;line-height:1.35;display:flex;align-items:center;gap:7px}.section-title:before{content:"";width:4px;height:14px;border-radius:4px;background:var(--primary)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.section-head .section-title{margin-bottom:0}.progress{width:100%;height:8px;background:#e6eeea;border-radius:8px;overflow:hidden;margin-top:13px}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--blue))}
    .primary,.quick-add{border:1px solid var(--primary);border-radius:8px;background:var(--primary);color:#fff;padding:11px 13px;font-size:14px;font-weight:800;cursor:pointer}.quick-add{width:100%;padding:14px;font-size:15px;box-shadow:0 7px 16px rgba(31,122,92,.18)}.primary:hover,.quick-add:hover{background:var(--primary2)}.ghost,.secondary-add,.icon-btn,.inline-actions button,.feedback-row button{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer}.secondary-add{background:var(--surface);color:var(--muted)}.danger{background:#fff1ef!important;border-color:#ffd5d0!important;color:var(--danger)!important}.plain-btn{border:none;background:transparent;color:var(--primary2);font-weight:800;cursor:pointer;padding:4px 0}
    .badge{display:inline-flex;align-items:center;min-height:24px;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;background:#eef4f1;color:#38524a;border:1px solid transparent}.p1,.tight{background:#fff0ed;color:#9e322b;border-color:#ffd3cc}.p2,.normal{background:#fff7e8;color:#935207;border-color:#ffdda3}.p3,.light{background:#edf8f2;color:#1f6b45;border-color:#c8ead7}.blocked,.rest{background:#f1f3f2;color:#53625c;border-color:#dde5e1}.ai-on{background:#e8f7f0;color:#176449;border-color:#c5e8d8}.slot-badge{background:#f5f7f6;color:#53625c;border-color:#e4ebe7}
    .seg,.inline-actions,.feedback-row,.chip-row{display:flex;gap:8px;flex-wrap:wrap}.seg{overflow:auto;flex-wrap:nowrap;margin-bottom:12px;padding-bottom:2px}.seg button{border:1px solid var(--line);background:var(--surface);white-space:nowrap;color:var(--muted);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}.seg button.active{background:#eaf7f1;color:var(--primary2);border-color:#b9dfcf}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:40}.nav-btn{border:none;background:transparent;color:var(--muted);font-size:13px;padding:8px 0;cursor:pointer;border-radius:8px}.nav-btn.active{color:var(--primary2);font-weight:800;background:#eef7f2}
    .entry-list{display:grid;gap:9px}.entry-item{border:1px solid var(--line2);background:#fbfcfb;border-radius:8px;padding:11px}.entry-text,.task-title{font-size:14px;font-weight:800;line-height:1.45;word-break:break-word}.entry-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:7px}.notice{padding:10px 11px;border:1px solid #d5e5de;background:#f6fbf8;border-radius:8px;color:#40564e;font-size:12px;line-height:1.55;margin-bottom:11px}.row,.task-row,.today-head{display:flex;justify-content:space-between;gap:11px;align-items:flex-start}.row>div,.task-row>div,.today-head>div{min-width:0}.done{text-decoration:line-through;color:var(--muted)}
    .slot{border:1px solid var(--line2);background:#fbfcfb;border-radius:8px;padding:11px;margin-top:9px}.slot-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-weight:800}.slot-list{display:grid;gap:8px}.slot-item{display:flex;align-items:flex-start;gap:8px;border-top:1px dashed var(--line2);padding-top:8px}.slot-item:first-child{border-top:none;padding-top:0}.slot-item input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary)}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{text-align:center;font-size:11px;color:var(--muted);font-weight:800;padding:4px}.day-cell{min-height:58px;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:6px;text-align:left;cursor:pointer}.day-cell.out{opacity:.35}.day-cell.selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(31,122,92,.12)}.day-num{font-size:13px;font-weight:800}.day-mark{margin-top:8px;width:100%;height:6px;border-radius:8px;background:#e5ece8}.mark-light{background:#c8ead7}.mark-normal{background:#ffdda3}.mark-tight{background:#ffd3cc}.mark-blocked,.mark-rest,.mark-no_schedule{background:#cfd8d3}.day-label{font-size:10px;margin-top:4px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .drawer{position:fixed;inset:0;background:rgba(24,32,29,.34);display:none;align-items:flex-end;z-index:60}.drawer.open{display:flex}.sheet{width:min(430px,100%);margin:0 auto;background:#fff;border-radius:8px 8px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto;box-shadow:0 -12px 28px rgba(24,32,29,.12)}.sheet h3{margin:0 0 14px;font-size:18px}.field{margin-bottom:12px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--muted)}input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--text)}textarea{min-height:86px;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;border-color:#9ed0bc;box-shadow:0 0 0 3px rgba(31,122,92,.12)}details{margin-top:12px;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--soft)}summary{cursor:pointer;font-weight:800;color:#374c44}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet-actions{display:flex;gap:10px;margin-top:14px}.sheet-actions button{flex:1}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #cfe3dc;border-radius:8px;background:#f2faf6;margin-top:12px}.switch-wrap{position:relative;width:50px;height:28px;flex-shrink:0}.switch-wrap input{opacity:0;width:0;height:0;position:absolute}.slider{position:absolute;inset:0;background:#dbe4e0;border-radius:8px;transition:.2s}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:7px;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:.2s}.switch-wrap input:checked+.slider{background:var(--primary)}.switch-wrap input:checked+.slider:before{transform:translateX(22px)}
    .setting-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line2)}.setting-item:last-child{border-bottom:none}.setting-item select{max-width:150px}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);width:min(390px,calc(100% - 28px));z-index:80;background:rgba(23,33,29,.94);color:#fff;border-radius:8px;padding:11px 12px;font-size:13px;line-height:1.45;box-shadow:0 10px 26px rgba(24,32,29,.18);display:none}.toast.error{background:rgba(154,51,45,.96)}
  </style>
</head>
<body>
<script src="config.js"></script>
<div class="phone">
  <div class="topbar"><h1 class="title">AI私人日程秘书</h1><p class="subtitle">你只管记下来，AI 帮你分类、安排、顺延和重排。</p></div>
  <div class="content">
    <section id="screen-today" class="screen active">
      <div class="card hero"><h2 id="heroText">今天怎么过，先看这一页。</h2><div id="todaySummary" class="muted">把事项放进池子后，主动整理一次日程。</div><div class="progress"><div id="todayProgressBar" class="progress-bar"></div></div><div class="helper" id="todayProgressText">今日进度 0%</div></div>
      <div class="card"><button class="quick-add" onclick="openAddSheet()">记录我想做的事</button><div class="helper">任务、习惯、兴趣、偏好、某天有事，都可以先放进事项池。</div></div>
      <div class="card"><div class="section-head"><div class="section-title">事项池</div><button class="secondary-add" onclick="openAddSheet()">记录事项</button></div><div class="notice">AI 只在你主动整理时介入，不会每新增一条就消耗 token。</div><div id="entryPoolToday"></div></div>
      <div class="card"><div class="section-head"><div class="section-title">今日安排</div><span id="todayTightness" class="badge normal">待整理</span></div><div id="todaySchedule"></div></div>
      <div class="card"><div class="section-title">截止提醒</div><div id="deadlineList"></div></div>
    </section>
    <section id="screen-calendar" class="screen"><div class="card"><div class="month-nav"><button class="icon-btn" onclick="changeMonth(-1)">上月</button><strong id="monthTitle"></strong><button class="icon-btn" onclick="changeMonth(1)">下月</button></div><div id="calendarGrid" class="calendar-grid"></div></div><div class="card"><div class="section-head"><div class="section-title">当天详情</div><button class="secondary-add" onclick="openDaySheet(selectedDate)">展开</button></div><div id="selectedDayDetail"></div></div></section>
    <section id="screen-items" class="screen"><div class="card"><div class="section-head"><div class="section-title">事项库</div><button class="secondary-add" onclick="openAddSheet()">记录事项</button></div><div class="seg" id="itemFilters"></div><div id="itemList"></div></div></section>
    <section id="screen-settings" class="screen"><div class="card"><div class="section-title">我的偏好</div><div id="preferenceForm"></div></div><div class="card"><div class="section-title">工具</div><div class="setting-item"><div><div>帮助说明</div><div class="helper">查看产品逻辑。</div></div><button class="icon-btn" onclick="openHelp()">查看</button></div><div class="setting-item"><div><div>数据清空</div><div class="helper">删除当前本地所有任务、事项和日程。</div></div><button class="icon-btn danger" onclick="clearAllData()">清空</button></div><div id="status" class="helper"></div></div></section>
  </div>
  <nav class="bottom-nav"><button class="nav-btn active" onclick="switchTab('today',this)">今日</button><button class="nav-btn" onclick="switchTab('calendar',this)">日历</button><button class="nav-btn" onclick="switchTab('items',this)">事项库</button><button class="nav-btn" onclick="switchTab('settings',this)">设置</button></nav>
</div>

<div id="addDrawer" class="drawer" onclick="closeDrawerByMask(event)"><div class="sheet">
  <h3>记录事项</h3>
  <div class="field"><label>我想记录</label><textarea id="taskInput" placeholder="例如：月底交报告 / 每天散步 / 周五全天有事 / 想多看书 / 周末尽量轻松"></textarea></div>
  <div class="field"><label>相关日期 / 截止日期（可选）</label><input id="deadlineInput" type="date"></div>
  <div class="switch-row"><div><strong>AI 默认不自动处理</strong><div class="helper">先进入事项池，需要时再点击“AI整理日程”。</div></div><label class="switch-wrap"><input id="autoPlanSwitch" type="checkbox" disabled><span class="slider"></span></label></div>
  <details><summary>更多设置</summary><div class="two-col" style="margin-top:12px"><div class="field"><label>开始日期</label><input id="startDateInput" type="date"></div><div class="field"><label>提醒时间</label><input id="reminderTimeInput" type="time"></div></div><div class="field"><label>优先级模式</label><select id="priorityModeInput"><option value="ai" selected>AI 自动判断</option><option value="manual_p1">手动：应立即推进</option><option value="manual_p2">手动：应稳定推进</option><option value="manual_p3">手动：可择时处理</option></select></div><div class="two-col"><div class="field"><label>难度</label><select id="difficultyInput"><option value="">AI 自动判断</option><option value="简单">简单</option><option value="中等">中等</option><option value="困难">困难</option></select></div><div class="field"><label>预计总耗时</label><input id="effortInput" placeholder="AI 自动估计，可手填"></div></div></details>
  <div class="sheet-actions"><button class="ghost" onclick="closeAddSheet()">取消</button><button class="primary" onclick="addTask()">保存到事项池</button></div>
</div></div>
<div id="dayDrawer" class="drawer" onclick="closeDayDrawerByMask(event)"><div class="sheet"><h3 id="daySheetTitle">当天详情</h3><div id="daySheetBody"></div></div></div>
<div id="missDrawer" class="drawer" onclick="closeMissDrawerByMask(event)"><div class="sheet"><h3>今天没完成</h3><div class="notice">没关系，告诉我原因，我会帮你顺延或重排。</div><div id="missReasonList" class="feedback-row"></div><div class="sheet-actions"><button class="ghost" onclick="closeMissDrawer()">取消</button></div></div></div>

<script>
const STORAGE_KEY="ai_task_manager_app_v12",V2_BACKUP_KEY="ai_task_manager_app_v12_backup_before_v2";
const CATEGORY_LABELS={must:"必做事项",goal:"长期目标",habit:"日常习惯",leisure:"兴趣放松",errand:"临时杂事",preference:"用户偏好",time_constraint:"时间限制",legacy_task:"旧任务",unclassified:"待整理"};
const SLOT_LABELS={morning:"上午",afternoon:"下午",evening:"晚上",bedtime:"睡前",anytime:"空闲时"};
const DAY_LABELS={light:"轻松",normal:"正常",tight:"偏紧",rest:"休息日",blocked:"全天有事",no_schedule:"不安排"};
let state=loadState(),currentFilter="all",selectedDate=todayStr(),calendarMonth=todayStr().slice(0,7),missContext=null,AI_CONFIG=initAIConfig();
function uid(p="id"){return p+"_"+Math.random().toString(36).slice(2,9)+"_"+Date.now().toString(36).slice(-6)}
function formatDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function todayStr(){return formatDate(new Date())}
function plusDays(s,n){const d=new Date((s||todayStr())+"T00:00:00");d.setDate(d.getDate()+n);return formatDate(d)}
function diffDays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)}
function normalizeDate(v,fallback=""){const m=String(v||"").match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:fallback}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function safeGet(k){try{return localStorage.getItem(k)||""}catch{return""}}function safeSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function cleanBaseUrl(v){return String(v||"").trim().replace(/\/+$/,"")}
function initAIConfig(){const q=new URLSearchParams(location.search),queryBase=q.get("ai_api")||q.get("api_base")||"",base=cleanBaseUrl(queryBase||window.AI_TASK_API_BASE_URL||safeGet("AI_TASK_API_BASE_URL"));if(queryBase&&base)safeSet("AI_TASK_API_BASE_URL",base);return{baseURL:base,paths:{quick:"/api/plan-task-quick",detail:"/api/plan-task-detail",organize:"/api/organize-schedule",rescheduleDay:"/api/reschedule-day",rescheduleMissed:"/api/reschedule-missed",...(window.AI_TASK_API_PATHS||{})},timeouts:{quick:45000,detail:90000,organize:90000,rescheduleDay:90000,rescheduleMissed:90000}}}
function baseState(){return{schemaVersion:2,tasks:[],settings:{tone:"gentle",browserNotifyEnabled:false,asked:{}},entries:[],items:[],schedules:{},dayStates:{},preferences:{importantTime:"morning",maxDailyFocus:3,keepLeisureTime:true,includeExercise:false,lightWeekend:true,encouragementStyle:"gentle",planningMode:"balanced"},planningRuns:[],rescheduleLogs:[],migratedAt:""}}
function backupBeforeV2(raw){if(raw&&!safeGet(V2_BACKUP_KEY))safeSet(V2_BACKUP_KEY,raw)}
function loadState(){const b=baseState();try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return b;const p=JSON.parse(raw);if(p.schemaVersion!==2)backupBeforeV2(raw);return normalizeState(p,b)}catch{return b}}
function normalizeState(p,b=baseState()){const tasks=Array.isArray(p.tasks)?p.tasks.map(normalizeTask):[],settings={...b.settings,...(p.settings||{})};settings.asked=settings.asked||{};const entries=Array.isArray(p.entries)?p.entries.map(normalizeEntry):migrateTasksToEntries(tasks),items=Array.isArray(p.items)?p.items.map(normalizeItem):migrateTasksToItems(tasks,entries);const preferences={...b.preferences,...(p.preferences||{})};preferences.encouragementStyle=preferences.encouragementStyle||settings.tone||"gentle";return{...b,...p,schemaVersion:2,tasks,settings,entries,items,schedules:p.schedules&&typeof p.schedules==="object"?p.schedules:{},dayStates:p.dayStates&&typeof p.dayStates==="object"?p.dayStates:{},preferences,planningRuns:Array.isArray(p.planningRuns)?p.planningRuns:[],rescheduleLogs:Array.isArray(p.rescheduleLogs)?p.rescheduleLogs:[],migratedAt:p.migratedAt||new Date().toISOString()}}
function normalizeEntry(e){return{id:e.id||uid("entry"),text:e.text||e.rawText||e.title||"",status:e.status||"pending",createdAt:e.createdAt||new Date().toISOString(),updatedAt:e.updatedAt||e.createdAt||new Date().toISOString(),source:e.source||"manual",taskId:e.taskId||""}}
function normalizeItem(i){return{id:i.id||uid("item"),entryId:i.entryId||"",taskId:i.taskId||"",rawText:i.rawText||i.title||"",title:i.title||i.rawText||"",category:i.category||"unclassified",status:i.status||"active",priority:i.priority||"medium",importance:Number(i.importance||2),urgency:Number(i.urgency||2),deadline:i.deadline||null,fixedDate:i.fixedDate||null,recurrence:i.recurrence||null,preferredTime:i.preferredTime||"anytime",durationBucket:i.durationBucket||"medium",energy:i.energy||"medium",flexible:i.flexible!==false,createdAt:i.createdAt||new Date().toISOString(),updatedAt:i.updatedAt||i.createdAt||new Date().toISOString(),aiReason:i.aiReason||""}}
function normalizeTask(t){return{id:t.id||uid("task"),title:t.title||t.task||"",startDate:t.startDate||t.start_date||todayStr(),deadline:t.deadline||t.endDate||t.end_date||todayStr(),reminderTime:t.reminderTime||"",priorityMode:t.priorityMode||"ai",userDifficulty:t.userDifficulty||t.difficulty||"",userEffortEstimate:t.userEffortEstimate||t.effortEstimate||"",autoPlan:typeof t.autoPlan==="boolean"?t.autoPlan:!!t.ai,ai:normalizeAI(t.ai),done:!!t.done,detailOpen:!!t.detailOpen,dailyFeedbackHistory:Array.isArray(t.dailyFeedbackHistory)?t.dailyFeedbackHistory:[],pendingReasonCheck:!!t.pendingReasonCheck,planningStatus:"",createdAt:t.createdAt||new Date().toISOString()}}
function normalizeAI(ai){if(!ai)return null;ai.phases=Array.isArray(ai.phases)?ai.phases.map((p,i)=>({id:p.id||uid("phase"),phase_name:p.phase_name||`阶段 ${i+1}`,from_date:p.from_date||"",to_date:p.to_date||"",duration_days:Number(p.duration_days||1),goal:p.goal||"",open:!!p.open||i===0,rest_after_phase:p.rest_after_phase||{needed:false,days:0,suggestion:""},daily_plan:Array.isArray(p.daily_plan)?p.daily_plan.map((d,j)=>({id:d.id||uid("day"),day_label:d.day_label||`第 ${j+1} 天`,date:d.date||"",time_range:d.time_range||"",task:d.task||"",done:!!d.done})):[]})):[];return ai}
function migrateTasksToEntries(tasks){return tasks.map(t=>normalizeEntry({id:`entry_${t.id}`,text:t.title,status:"processed",createdAt:t.createdAt,updatedAt:t.createdAt,source:"legacy_task",taskId:t.id}))}
function migrateTasksToItems(tasks,entries){return tasks.map(t=>{const e=entries.find(x=>x.taskId===t.id)||{};return normalizeItem({id:`item_${t.id}`,entryId:e.id||`entry_${t.id}`,taskId:t.id,rawText:t.title,title:t.title,category:"legacy_task",status:t.done?"done":"active",priority:t.ai?.priority==="p1"?"high":t.ai?.priority==="p3"?"low":"medium",importance:t.ai?.priority==="p1"?3:2,urgency:t.ai?.priority==="p1"?3:2,deadline:t.deadline||null,createdAt:t.createdAt,updatedAt:t.createdAt,aiReason:"由 v1.2 任务数据兼容迁移"})})}
function saveState(){state=normalizeState(state);localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}

function localPlan(reason="local_plan"){state.items=state.items.map(i=>{const c=i.category==="unclassified"||i.category==="legacy_task"?categorizeText(`${i.title} ${i.rawText}`,i):i.category;return normalizeItem({...i,category:c,priority:["must","time_constraint"].includes(c)?"high":c==="leisure"?"low":"medium",importance:c==="must"?3:2,urgency:i.deadline?3:2,aiReason:i.aiReason||"本地规则整理"})});state.entries=state.entries.map(e=>({...e,status:"processed",updatedAt:new Date().toISOString()}));applyDayConstraintsFromItems();state.schedules={};const horizon=21,dates=Array.from({length:horizon},(_,i)=>plusDays(todayStr(),i));dates.forEach(d=>{const s=ensureSchedule(d);if(isBlocked(d)){s.status=state.dayStates[d].state;s.summary=DAY_LABELS[s.status];s.dayTightness=s.status;return}});const active=state.items.filter(i=>i.status!=="done"&&i.status!=="deleted"&&i.category!=="preference"&&i.category!=="time_constraint").sort((a,b)=>priorityFor(b)-priorityFor(a));const recurring=active.filter(i=>i.category==="habit"),once=active.filter(i=>i.category!=="habit");const max=Number(state.preferences.maxDailyFocus||3),capacity=state.preferences.planningMode==="compact"?max+2:state.preferences.planningMode==="relaxed"?Math.max(1,max-1):max+1;function place(item,from=todayStr()){const start=Math.max(0,diffDays(todayStr(),from));for(let i=start;i<dates.length;i++){const date=dates[i];if(isBlocked(date))continue;if(state.preferences.lightWeekend&&isWeekend(date)&&item.category==="goal")continue;const s=ensureSchedule(date),count=Object.values(s.slots).flat().length;if(count>=capacity&&item.category!=="leisure")continue;if(item.deadline&&diffDays(date,item.deadline)<0)continue;const slot=slotFor(item);if(!s.slots[slot].includes(item.id))s.slots[slot].push(item.id);return date}return null}once.forEach(i=>place(i,i.fixedDate||todayStr()));recurring.forEach(i=>dates.slice(0,7).forEach(d=>{if(!isBlocked(d)){const s=ensureSchedule(d),slot=slotFor(i);if(Object.values(s.slots).flat().length<capac function applyDayConstraintsFromItems(){state.items.forEach(i=>{const t=i.title||i.rawText;if(i.category!=="time_constraint")return;const d=i.deadline||normalizeDate(t);if(!d)return;let st=/休息/.test(t)?"rest":/不安排/.test(t)?"no_schedule":"blocked";state.dayStates[d]={date:d,state:st,label:DAY_LABELS[st],note:t,createdAt:state.dayStates[d]?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()}})}

async function organizeSchedule(){setStatus(hasAIService()?"正在请 AI 整理日程...":"当前未连接 AI 服务，先以本地模式使用。");if(!hasAIService()){localPlan("organize_local");return}try{const data=await requestAI("organize",buildSecretaryPayload("organize"));mergeSecretaryResult(data,"organize_ai");setStatus("AI 已整理日程。")}catch(e){setStatus(e.message||"AI 整理失败，已使用本地模式。",true);localPlan("organize_fallback")}}

function localRescheduleDay(date,reason){const s=ensureSchedule(date),ids=Object.values(s.slots).flat();s.slots={morning:[],afternoon:[],evening:[],bedtime:[],anytime:[]};s.status=state.dayStates[date]?.state||"blocked";const moved=[];ids.forEach(id=>{const item=getItem(id);if(!item)return;const to=nextAvailableDate(date),target=ensureSchedule(to),slot=slotFor(item);target.slots[slot].push(id);target.deferredFrom=target.deferredFrom||[];target.deferredFrom.push({itemId:id,from:date,reason});moved.push(`${item.title} -> ${to}`)});finalizeSchedules(`已根据“${reason}”顺延安排。`);state.rescheduleLogs.unshift({id:uid("log"),createdAt:new Date().toISOString(),reason,sourceDate:date,affectedItemIds:ids,movedToDates:[...new Set(moved.map(x=>x.split(" -> ")[1]))],message:moved.length?`已顺延：${moved.join("；")}。`:"当天没有需要顺延的事项。"});state.planningRuns.unshift({id:uid("run"),type:"reschedule_day_local",createdAt:new Date().toISOString(),inputEntryIds:[],affectedDates:Object.keys(state.schedules),aiMode:"local",summary:state.rescheduleLogs[0].message});saveState();render();if(dayDrawer.classList.contains("open"))openDaySheet(date);setStatus(state.rescheduleLogs[0].message)}
function toggleItemDone(id){const item=getItem(id);if(!item)return;item.status=item.status==="done"?"active":"done";item.updatedAt=new Date().toISOString();const task=getTask(item.taskId);if(task)task.done=item.status==="done";saveState();render();setStatus(item.status==="done"?"已记录完成。":"已取消完成。")}
function openMissDrawer(id,date){missContext={itemId:id,date};missReasonList.innerHTML=["时间不够","任务太难","状态不好","临时有事","不想做","忘了","计划太满"].map(r=>`<button onclick="submitMissed('${r}')">${r}</button>`).join("");missDrawer.classList.add("open")}function closeMissDrawer(){missDrawer.classList.remove("open")}function closeMissDrawerByMask(e){if(e.target.id==="missDrawer")closeMissDrawer()}
async function submitMissed(reason){if(!missContext)return;const {itemId,date}=missContext;closeMissDrawer();setStatus(hasAIService()?"正在根据原因顺延安排...":aiUnavailableMessage());if(hasAIService()){try{const data=await requestAI("rescheduleMissed",buildSecretaryPayload("reschedule_missed",{itemId,date,reason}));mergeSecretaryResult(data,"reschedule_missed_ai");return}catch(e){setStatus(e.message||"AI 重排失败，已使用本地模式。",true)}}localRescheduleMissed(itemId,date,reason)}
function localRescheduleMissed(itemId,date,reason){Object.values(state.schedules).forEach(s=>Object.keys(s.slots||{}).forEach(k=>s.slots[k]=s.slots[k].filter(id=>id!==itemId)));const item=getItem(itemId),to=nextAvailableDate(date),s=ensureSchedule(to),slot=slotFor(item);s.slots[slot].push(itemId);s.deferredFrom=s.deferredFrom||[];s.deferredFrom.push({itemId,from:date,reason});const msg=`“${item?.title||"事项"}”因“${reason}”顺延到 ${to}，后续安排已重新平衡。`;state.rescheduleLogs.unshift({id:uid("log"),createdAt:new Date().toISOString(),reason,sourceDate:date,affectedItemIds:[itemId],movedToDates:[to],message:msg});finalizeSchedules(msg);state.planningRuns.unshift({id:uid("run"),type:"reschedule_missed_local",createdAt:new Date().toISOString(),inputEntryIds:[],affectedDates:Object.keys(state.schedules),aiMode:"local",summary:msg});saveState();render();setStatus(msg)}
function renderItems(){const cats=["all","must","goal","habit","leisure","errand","preference","time_constraint","done"];itemFilters.innerHTML=cats.map(c=>`<button class="${currentFilter===c?"active":""}" onclick="setItemFilter('${c}')">${c==="all"?"全部":c==="done"?"已完成":CATEGORY_LABELS[c]}</button>`).join("");let list=state.items.filter(i=>i.status!=="deleted");if(currentFilter==="done")list=list.filter(i=>i.status==="done");else if(currentFilter!=="all")list=list.filter(i=>i.category===currentFilter);itemList.innerHTML=list.length?list.map(renderItemCard).join(""):`<div class="task-card">当前没有符合筛选条件的事项。</div>`}
function setItemFilter(f){currentFilter=f;renderItems()}
function renderItemCard(i){const task=getTask(i.taskId),p=priorityFor(i)>=3?"p1":priorityFor(i)===2?"p2":"p3";return `<div class="task-card"><div class="task-row"><div><div class="task-title ${i.status==="done"?"done":""}">${esc(i.title)}</div><div class="mini">${CATEGORY_LABELS[i.category]||"事项"}${i.deadline?` ｜ 截止：${esc(i.deadline)}`:""}</div><div class="entry-meta"><span class="badge ${p}">${i.priority==="high"?"重要":i.priority==="low"?"可选":"普通"}</span><span class="badge ${task?.autoPlan?"ai-on":"slot-badge"}">${task?.autoPlan?"已启用AI":"未启用AI"}</span></div></div><button class="icon-btn" onclick="toggleTaskDetail('${i.taskId}')">${task?.detailOpen?"收起":"详情"}</button></div>${task?.detailOpen?`<div class="detail-block">${task.autoPlan?renderPlannedDetail(task):renderUnplannedDetail(task)}</div>`:""}<div class="inline-actions detail-block"><button onclick="toggleItemDone('${i.id}')">${i.status==="done"?"取消完成":"标记完成"}</button><button class="danger" onclick="deleteItem('${i.id}')">删除</button></div></div>`}
function deleteItem(id){if(!confirm("确定删除这个事项吗？"))return;const i=getItem(id);if(i)i.status="deleted";saveState();render();setStatus("事项已删除。")}
function toggleTaskDetail(id){const t=getTask(id);if(t){t.detailOpen=!t.detailOpen;saveState();renderItems()}}
function renderUnplannedDetail(t){return `<div class="inline-actions"><button class="primary" onclick="enableAIPlan('${t.id}')">生成 AI 计划</button><button onclick="markSimpleTaskDone('${t.id}')">${t.done?"取消完成":"标记完成"}</button></div><div class="detail-block mini">当前未启用 AI。你可以先完成它，也可以让 AI 判断优先级并拆出计划。</div><div class="detail-block mini">截止：${esc(t.deadline)} ｜ ${deadlineText(t.deadline)}</div>`}
function renderPlannedDetail(t){const ai=t.ai,p=ai?.priority||"p2",pct=progress(t);if(!ai)return `<div class="mini">正在等待 AI 返回轻量判断。</div>`;return `<div class="priority-line"><span class="badge ${p}">${p==="p1"?"应立即推进":p==="p2"?"应稳定推进":"可择时处理"}</span><div class="helper">${esc(ai.priority_reason||"等待判断")}</div></div><div class="detail-block mini">${esc(ai.summary||"AI 已生成轻量建议。")}</div>${ai.complexity==="complex"?renderComplex(t,pct):renderSimple(t,pct)}<div class="inline-actions detail-block"><button onclick="setManualPriority('${t.id}','p1')">改为立即推进</button><button onclick="setManualPriority('${t.id}','p2')">改为稳定推进</button><button onclick="setManualPriority('${t.id}','p3')">改为择时处理</button><button class="primary" onclick="regeneratePlan('${t.id}')">重新生成 AI 计划</button>${ai.complexity!=="complex"?`<button onclick="markSimpleTaskDone('${t.id}')">${t.done?"取消完成":"标记完成"}</button>`:""}</div>`}
function renderSimple(t,pct){return `<div class="detail-block"><div class="section-title">今日建议</div><div class="mini">${esc(t.ai?.today_focus||"找一个合适的时间完成即可。")}</div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div class="helper">当前进度 ${pct}%</div></div>`}
function renderComplex(t,pct){const phases=(t.ai?.phases||[]).map(p=>`<div class="slot"><strong>${esc(p.phase_name)}</strong><div class="mini">${esc(p.from_date)} 至 ${esc(p.to_date)} ｜ ${esc(p.duration_days)} 天</div><div class="mini">目标：${esc(p.goal)}</div></div>`).join("");const days=(t.ai?.phases||[]).map(p=>(p.daily_plan||[]).map(d=>`<div class="slot-item"><input type="checkbox" ${d.done?"checked":""} onchange="toggleDailyPlan('${t.id}','${p.id}','${d.id}')"><div><strong class="${d.done?"done":""}">${esc(d.day_label)} ｜ ${esc(d.date)}</strong><div class="mini ${d.done?"done":""}">${esc(d.task)}${d.time_range?" ｜ "+esc(d.time_range):""}</div></div></div>`).join("")).join("");return `<div class="detail-block"><div class="section-title">阶段计划</div>${phases||`<div class="mini">暂无阶段计划。</div>`}</div><div class="detail-block"><div class="section-title">每日安排</div>${days||`<div class="mini">暂无每日安排。</div>`}</div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div class="helper">当前进度 ${pct}%</div>`}
function progress(t){if(!t.ai||t.ai.complexity!=="complex")return t.done?100:0;const all=t.ai.phases.flatMap(p=>p.daily_plan||[]);return all.length?Math.round(all.filter(x=>x.done).length/all.length*100):0}
function calcDone(t){if(!t.ai||t.ai.complexity!=="complex")return!!t.done;const all=t.ai.phases.flatMap(p=>p.daily_plan||[]);return all.length&&all.every(x=>x.done)}
function toggleDailyPlan(tid,pid,did){const t=getTask(tid),p=t?.ai?.phases?.find(x=>x.id===pid),d=p?.daily_plan?.find(x=>x.id===did);if(!d)return;d.done=!d.done;t.done=calcDone(t);saveState();render()}
function markSimpleTaskDone(id){const t=getTask(id);if(t){t.done=!t.done;const item=state.items.find(i=>i.taskId===id);if(item)item.status=t.done?"done":"active";saveState();render();setStatus(t.done?"已记录完成。":"已取消完成。")}}
function setManualPriority(id,p){const t=getTask(id);if(!t)return;if(!t.ai)t.ai={complexity:"simple",phases:[]};t.ai.priority=p;t.ai.priority_reason="用户手动调整";t.priorityMode="manual_"+p;saveState();renderItems();setStatus("优先级已手动调整。")}
function planPayload(task,adjustmentContext=null,quickPlan=null){return{task:task.title,startDate:task.startDate,endDate:task.deadline,reminderTime:task.reminderTime,priorityMode:task.priorityMode,difficulty:task.userDifficulty,effortEstimate:task.userEffortEstimate,tone:state.settings.tone,adjustmentContext,quickPlan}}
async function enableAIPlan(id){await analyzeTask(id)}function regeneratePlan(id){analyzeTask(id)}
async function analyzeTask(id,adjustmentContext=null){const task=getTask(id);if(!task)return;if(!hasAIService()){task.detailOpen=true;saveState();render();setStatus(aiUnavailableMessage(),true);return null}const previous={autoPlan:task.autoPlan,ai:task.ai,done:task.done};task.autoPlan=true;task.detailOpen=true;task.ai=null;task.planningStatus="正在判断任务类型...";saveState();render();try{const quick=await requestAI("quick",planPayload(task,adjustmentContext));task.ai=normalizeResult(quick,task);task.done=calcDone(task);if(task.ai.complexity==="complex"){try{const detail=await requestAI("detail",planPayload(task,adjustmentContext,quick));task.ai=normalizeResult({...quick,...detail,complexity:"complex"},task)}catch{}}task.planningStatus="";saveState();render();setStatus("AI 规划完成。");return task}catch(e){task.autoPlan=previous.autoPlan;task.ai=previous.ai;task.done=previous.done;task.planningStatus="";saveState();render();setStatus(e.message||"AI 规划失败。",true);return null}}
function normalizeResult(d,task){const r={complexity:d.complexity==="complex"?"complex":"simple",complexity_reason:d.complexity_reason||"",priority:["p1","p2","p3"].includes(d.priority)?d.priority:"p2",priority_reason:d.priority_reason||"",difficulty:d.difficulty||task.userDifficulty||"中等",effort_estimate:d.effort_estimate||task.userEffortEstimate||"",summary:d.summary||"",encouragement:d.encouragement||"",today_focus:d.today_focus||"",phases:[]};if(r.complexity==="complex"&&Array.isArray(d.phases))r.phases=d.phases.slice(0,3).map((p,i)=>({id:uid("phase"),phase_name:p.phase_name||`阶段 ${i+1}`,from_date:normalizeDate(p.from_date,task.startDate),to_date:normalizeDate(p.to_date,task.deadline),duration_days:Number(p.duration_days||1),goal:p.goal||"",open:i===0,rest_after_phase:{needed:!!p?.rest_after_phase?.needed,days:Number(p?.rest_after_phase?.days||0),suggestion:p?.rest_after_phase?.suggestion||""},daily_plan:Array.isArray(p.daily_plan)?p.daily_plan.slice(0,3).map((x,j)=>({id:uid("day"),day_label:x.day_label||`第 ${j+1} 天`,date:normalizeDate(x.date,plusDays(task.startDate,i+j)),time_range:x.time_range||"",task:x.task||"",done:false})):[]}));return r}
function renderPreferences(){const p=state.preferences;preferenceForm.innerHTML=`${prefSelect("importantTime","重要事项适合",p.importantTime,[["morning","上午"],["afternoon","下午"],["evening","晚上"]])}${prefSelect("maxDailyFocus","每天最多重点",String(p.maxDailyFocus),[["1","1个"],["2","2个"],["3","3个"],["4","4个"]])}${prefSwitch("keepLeisureTime","每天保留放松时间",p.keepLeisureTime)}${prefSwitch("includeExercise","每天安排运动",p.includeExercise)}${prefSwitch("lightWeekend","周末尽量轻松",p.lightWeekend)}${prefSelect("planningMode","AI安排倾向",p.planningMode,[["relaxed","轻松"],["balanced","平衡"],["compact","紧凑"]])}${prefSelect("encouragementStyle","鼓励语风格",p.encouragementStyle,[["gentle","温柔"],["firm","直接"],["minimal","克制"],["lively","活泼"]])}`;document.querySelectorAll("[data-pref]").forEach(el=>el.onchange=()=>updatePreference(el.dataset.pref,el.type==="checkbox"?el.checked:el.value))}
function prefSelect(k,label,val,opts){return `<div class="setting-item"><div><div>${label}</div><div class="helper">AI 整理日程时会参考。</div></div><select data-pref="${k}">${opts.map(o=>`<option value="${o[0]}" ${String(val)===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>`}
function prefSwitch(k,label,val){return `<div class="setting-item"><div><div>${label}</div><div class="helper">开启后会进入日程安排。</div></div><label class="switch-wrap"><input data-pref="${k}" type="checkbox" ${val?"checked":""}><span class="slider"></span></label></div>`}
function updatePreference(k,v){state.preferences[k]=k==="maxDailyFocus"?Number(v):v;state.settings.tone=state.preferences.encouragementStyle||state.settings.tone;saveState();setStatus("偏好已保存。")}
function render(){renderEntryPool("entryPoolToday",5);renderToday();renderCalendar();renderItems();renderPreferences();renderEntryPool("entryPool",10)}
window.addEventListener("load",()=>{startDateInput.value=todayStr();saveState();render();setInterval(()=>saveState(),30000)})
</script>
